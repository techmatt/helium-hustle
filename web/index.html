    <script>
      // The theme before the first paint (src/theme.ts owns it after).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('hh.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
