[package]
name = "hh-sim"
description = "Native CLI for Helium Hustle: runs seeds, replays records, agents, careers and experiments"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
hh-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# The CLI's and the tests' allocator (main.rs); never in hh-wasm's build of this crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc.workspace = true
