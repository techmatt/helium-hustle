# hh-core's invariants, enforced by `cargo clippy` (CLAUDE.md, "Engine rules").
# Never `#[allow]` these: use `crate::math` (libm), `BTreeMap`, and a tick passed in.

disallowed-methods = [
    # Platform float transcendentals differ across targets and break native = wasm.
    # Use `crate::math` (the `libm` crate) instead.
    { path = "f64::powf", reason = "platform float: use crate::math (libm)" },
    { path = "f64::powi", reason = "platform float: use crate::math (libm)" },
    { path = "f64::exp", reason = "platform float: use crate::math (libm)" },
    { path = "f64::exp2", reason = "platform float: use crate::math (libm)" },
    { path = "f64::exp_m1", reason = "platform float: use crate::math (libm)" },
    { path = "f64::ln", reason = "platform float: use crate::math (libm)" },
    { path = "f64::ln_1p", reason = "platform float: use crate::math (libm)" },
    { path = "f64::log", reason = "platform float: use crate::math (libm)" },
    { path = "f64::log2", reason = "platform float: use crate::math (libm)" },
    { path = "f64::log10", reason = "platform float: use crate::math (libm)" },
    { path = "f64::sqrt", reason = "platform float: use crate::math (libm)" },
    { path = "f64::cbrt", reason = "platform float: use crate::math (libm)" },
    { path = "f64::hypot", reason = "platform float: use crate::math (libm)" },
    { path = "f64::sin", reason = "platform float: use crate::math (libm)" },
    { path = "f64::cos", reason = "platform float: use crate::math (libm)" },
    { path = "f64::tan", reason = "platform float: use crate::math (libm)" },
    { path = "f64::sin_cos", reason = "platform float: use crate::math (libm)" },
    { path = "f64::asin", reason = "platform float: use crate::math (libm)" },
    { path = "f64::acos", reason = "platform float: use crate::math (libm)" },
    { path = "f64::atan", reason = "platform float: use crate::math (libm)" },
    { path = "f64::atan2", reason = "platform float: use crate::math (libm)" },
    { path = "f64::sinh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::cosh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::tanh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::asinh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::acosh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::atanh", reason = "platform float: use crate::math (libm)" },
    { path = "f64::mul_add", reason = "platform float: use crate::math (libm)" },
    { path = "f32::powf", reason = "platform float: use crate::math (libm)" },
    { path = "f32::powi", reason = "platform float: use crate::math (libm)" },
    { path = "f32::exp", reason = "platform float: use crate::math (libm)" },
    { path = "f32::ln", reason = "platform float: use crate::math (libm)" },
    { path = "f32::log", reason = "platform float: use crate::math (libm)" },
    { path = "f32::log2", reason = "platform float: use crate::math (libm)" },
    { path = "f32::log10", reason = "platform float: use crate::math (libm)" },
    { path = "f32::sqrt", reason = "platform float: use crate::math (libm)" },
    { path = "f32::sin", reason = "platform float: use crate::math (libm)" },
    { path = "f32::cos", reason = "platform float: use crate::math (libm)" },
    { path = "f32::tan", reason = "platform float: use crate::math (libm)" },
    # No clock: time is a tick count passed in.
    { path = "std::time::Instant::now", reason = "no clock in hh-core: time is a tick count" },
    { path = "std::time::SystemTime::now", reason = "no clock in hh-core: time is a tick count" },
]

# No hash-order leaks: iterate BTreeMap, Vec or an index order. No clock types at all.
disallowed-types = [
    { path = "std::time::Instant", reason = "no clock in hh-core: time is a tick count" },
    { path = "std::time::SystemTime", reason = "no clock in hh-core: time is a tick count" },
    { path = "std::collections::HashMap", reason = "hash order leaks: use BTreeMap" },
    { path = "std::collections::HashSet", reason = "hash order leaks: use BTreeSet" },
]
